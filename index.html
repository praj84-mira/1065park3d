<style data-keep>
:root{--ink:#1f1d1a;--muted:#77706a;--line:#e4ded5;--bg:#faf8f4;--accent:#8a5a35;--chip:#f1ece4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9d6d0;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#wrap{position:fixed;inset:0}
#wrap canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;pointer-events:none;background:linear-gradient(rgba(250,248,244,.92),rgba(250,248,244,.0))}
header h1{margin:0;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:22px;letter-spacing:.2px}
header .sub{font-size:11px;color:var(--muted);margin-top:1px}
#views{display:flex;gap:6px;margin-top:8px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-bottom:2px}
#views::-webkit-scrollbar{display:none}
.vbtn{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:16px;padding:6px 11px;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;backdrop-filter:blur(6px)}
.vbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top-left-radius:16px;border-top-right-radius:16px;box-shadow:0 -6px 24px rgba(0,0,0,.12);display:flex;flex-direction:column;max-height:44vh;padding-bottom:env(safe-area-inset-bottom);transition:max-height .25s}
#sheet.min{max-height:calc(96px + env(safe-area-inset-bottom))}
#grab{height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
#grab span{width:38px;height:4px;border-radius:2px;background:#cfc8bd}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;font:500 13px Inter,sans-serif;color:var(--muted);padding:7px 10px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff}
#panel{overflow-y:auto;padding:4px 14px 16px;flex:1;-webkit-overflow-scrolling:touch}
#sheet.min #panel{display:none}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 7px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;font:500 13px Inter,sans-serif;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip.ghost{background:transparent}
.sw{width:40px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:0;background:none;padding:0}
.sw i{display:block;width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on i{box-shadow:0 0 0 2px var(--ink)}
.sw b{font-weight:400;font-size:9.5px;color:var(--muted);text-align:center;line-height:1.15}
.card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.card.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.card .t{font-weight:600;font-size:14px}
.card .d{font-size:12px;color:var(--muted);margin-top:2px}
.card .grow{flex:1;min-width:0}
.card .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px}
.btn{border:0;background:var(--accent);color:#fff;font:600 14px Inter,sans-serif;border-radius:12px;padding:11px 14px;cursor:pointer;width:100%}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:7px}
.add{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;font:500 12.5px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.dirty{display:inline-block;font-size:11px;color:var(--accent);font-weight:600;margin-left:6px}
#selbar{position:absolute;left:50%;transform:translateX(-50%);display:none;gap:4px;align-items:center;background:rgba(31,29,26,.92);color:#fff;border-radius:14px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;z-index:5}
#selbar.show{display:flex}
#selbar .nm{font-size:12px;font-weight:600;padding:0 6px 0 6px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){#selbar{gap:3px;padding:5px}#selbar button{padding:7px 7px;font-size:12px}#selbar .nm{display:none}}
#selbar button{border:0;background:rgba(255,255,255,.12);color:#fff;font:500 13px Inter,sans-serif;border-radius:9px;padding:8px 10px;cursor:pointer}
#selbar button.del{background:#8b3b2e}

#dlg .box{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:360px}
#dlg h3{margin:0 0 4px;font-family:"Cormorant Garamond",serif;font-size:22px}
#dlg p{margin:0 0 12px;font-size:13px;color:var(--muted)}
#dlg input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:15px Inter,sans-serif;margin-bottom:12px;background:#fff}
#dlg .bts{display:flex;gap:8px}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 96px);background:rgba(31,29,26,.92);color:#fff;font-size:13px;padding:9px 14px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:88vw;text-align:center}
#toast.show{opacity:1}
.form label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:10px 0 5px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:15px Inter,sans-serif;background:#fff;color:var(--ink);margin:0}
.form textarea{min-height:64px;resize:vertical}
.form .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.form .inl{display:flex;gap:7px;align-items:center}
.form .inl input[type=color]{width:46px;height:40px;padding:2px;flex:none}
.form .stat{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
.form .prev{display:flex;gap:10px;align-items:center;margin-top:10px}
.form .prev img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#fff}
#dlg .box{max-height:88vh;overflow-y:auto}
.ci{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;margin-bottom:7px}
.ci img,.ci .ph{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:#efe9df}
.ci .grow{flex:1;min-width:0}.ci .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.ci .acts{display:flex;gap:4px;flex:none}
.ci .acts button,.ci .acts a{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font:500 12px Inter,sans-serif;color:var(--ink);text-decoration:none;cursor:pointer}
.ci .acts .pl{background:var(--ink);color:#fff;border-color:var(--ink)}
.info img{width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--line)}
.info .meta{font-size:13px;color:var(--muted);margin:8px 0}
.info .notes{font-size:14px;line-height:1.45;white-space:pre-wrap;margin:8px 0 12px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--muted)}
@media (min-width:900px){
 #sheet{left:auto;right:16px;bottom:16px;top:auto;width:380px;border-radius:16px;max-height:calc(100vh - 140px)}
 #sheet.min{max-height:96px}
}

 <div id="sheet"><div id="grab"><span></span></div><div id="tabs"></div><div id="panel"></div></div>

<script type="module" data-keep>
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- room geometry (feet) — from plan A-101 crop ---------- */
const W = 15.25, D = 15.3, H = 8.5;
const BAY0 = 2.6, BAY1 = 12.6, BAYD = 2.2, BAYH = 7.7;
const FIRE_Z = 4.1;

/* ---------- utilities ---------- */
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, amt){ const c = new THREE.Color(hex); const h = {}; c.getHSL(h); c.setHSL(h.h, h.s, Math.min(1, Math.max(0, h.l + amt))); return '#' + c.getHexString(); }
function rgba(hex, a){ const n = parseInt(new THREE.Color(hex).getHexString(), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function lum(hex){ const n = parseInt(hex.replace('#',''),16); return (0.299*(n>>16&255) + 0.587*(n>>8&255) + 0.114*(n&255))/255; }
function mod(a, n){ return ((a % n) + n) % n; }
const texCache = new Map();
function canvasTex(key, w, h, draw, opts = {}){
  if (texCache.has(key)) return texCache.get(key);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
  texCache.set(key, t); return t;
}

/* ---------- option catalogs ---------- */
const WALL_COLORS = [
  ['Warm white','#EDE8DE'],['Soft greige','#D8D0C3'],['Mushroom','#BBAE9E'],['Plaster pink','#E2C6B8'],
  ['Sage','#A9B39A'],['Deep teal','#2F5653'],['Ink blue','#2A3447'],['Ochre','#C99A55'],['Charcoal','#3B3A38']];
const FINISHES = [['paint','Paint'],['limewash','Limewash'],['molding','Panel molding'],['grasscloth','Grasscloth'],['oak','Oak paneling'],['walnut','Walnut paneling'],['trellis','Trellis paper'],['stripe','Stripe paper']];
const WALL_GROUPS = [['fire','Fireplace wall'],['window','Window wall'],['entry','Entry wall'],['opening','Dining-side wall']];
const FLOOR_TONES = [['Smoked oak','#6E5644'],['Dark walnut','#4B3528'],['Ebonized oak','#2F2822'],['Natural white oak','#B8996F'],['Pale oak','#D4BF9E']];
const MARBLES = [['calacatta','Calacatta','#EEEAE2'],['bardiglio','Bardiglio','#8E959B'],['nero','Nero Marquina','#202021'],['verde','Verde','#2A4034'],['travertine','Travertine','#D9C9AE'],['limestone','Limestone','#E0D8C8']];
const FABRICS = [['oatmeal','Oatmeal linen','#CFC3AE',0.95],['boucle','Cream bouclé','#ECE5D8',1],['camel','Camel leather','#9C6A3E',0.42],['sage','Sage velvet','#7E8C70',0.78],['navy','Navy velvet','#27324A',0.78],['rust','Rust velvet','#97492D',0.78],['mustard','Mustard','#B98F35',0.85],['blush','Blush','#D4AE9F',0.9],['charcoal','Charcoal','#46444A',0.9]];
const TABLES = [['walnut','Walnut','#5B3E2B'],['oak','White oak','#B08A60'],['travertine','Travertine','#D6C6AA'],['lacquer','Black lacquer','#1E1C1B']];
const RUGS = [['ivory','Ivory, bordered','#E9E1D1'],['vintage','Vintage red','#8C2F2B'],['blue','Blue geometric','#3D5A80'],['jute','Jute','#B79A6E'],['charcoal','Charcoal abstract','#3A3937']];
const DRAPE_COLORS = [['Ivory linen','#EEE7DA'],['Oatmeal','#CDBFA8'],['Sage','#8E9A80'],['Navy','#2B3550'],['Rust','#8E4A31'],['Charcoal','#4A4847']];
const ABOVE = [['abstract','Art · abstract'],['landscape','Art · landscape'],['mirror','Mirror'],['tv','TV'],['none','Nothing']];

/* ---------- textures ---------- */
function wallMap(f, color){
  const k = 'w:' + f + color;
  switch (f) {
    case 'limewash': return { map: canvasTex(k, 512, 512, (x, w, h) => {
      x.fillStyle = color; x.fillRect(0, 0, w, h); const r = rng(7);
      for (let i = 0; i < 200; i++) { const cx = r()*w, cy = r()*h, rad = 30 + r()*120; const col = r() < .5 ? shade(color, .07) : shade(color, -.07);
        for (const ox of [-w,0,w]) for (const oy of [-h,0,h]) { const g = x.createRadialGradient(cx+ox,cy+oy,0,cx+ox,cy+oy,rad); g.addColorStop(0, rgba(col,.22)); g.addColorStop(1, rgba(col,0)); x.fillStyle = g; x.fillRect(cx+ox-rad,cy+oy-rad,rad*2,rad*2); } }
    }), tile: [3,3] };
    case 'grasscloth': return { map: canvasTex(k, 512, 512, (x, w, h) => {
      x.fillStyle = color; x.fillRect(0,0,w,h); const r = rng(3);
      for (let i = 0; i < 2600; i++) { const y = r()*h, x0 = r()*w, len = 20 + r()*200, th = 1 + r()*2.2; x.fillStyle = rgba(shade(color, (r()-.5)*.2), .55); x.fillRect(x0, y, len, th); x.fillRect(x0 - w, y, len, th); }
      x.fillStyle = rgba(shade(color,-.2), .8); x.fillRect(0,0,2,h);
    }), tile: [3,3] };
    case 'oak': case 'walnut': {
      const tone = f === 'oak' ? '#B8936A' : '#5E402D';
      return { map: canvasTex(k, 512, 1024, (x, w, h) => {
        const r = rng(f === 'oak' ? 11 : 12); const bw = w/8;
        for (let b = 0; b < 8; b++) { x.fillStyle = shade(tone, (r()-.5)*.06); x.fillRect(b*bw, 0, bw, h);
          for (let g = 0; g < 16; g++) { const gx = b*bw + r()*bw, amp = 1 + r()*3, fr = .004 + r()*.01, ph = r()*6; x.beginPath(); x.moveTo(gx, 0); for (let y = 0; y <= h; y += 16) x.lineTo(gx + Math.sin(y*fr + ph)*amp, y); x.strokeStyle = rgba(shade(tone,-.2), .12 + r()*.12); x.lineWidth = .8 + r()*1.6; x.stroke(); }
          x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(b*bw, 0, 3, h); }
      }), tile: [4, 8.5], fixed: true };
    }
    case 'molding': return { map: canvasTex(k, 384, 1088, (x, w, h) => {
      const ppf = 128; x.fillStyle = color; x.fillRect(0,0,w,h);
      const panel = (x0,y0,x1,y1) => { const X0 = x0*ppf, X1 = x1*ppf, Y0 = (8.5-y1)*ppf, Y1 = (8.5-y0)*ppf;
        x.fillStyle = rgba(shade(color,-.025),1); x.fillRect(X0,Y0,X1-X0,Y1-Y0);
        x.lineWidth = 9; x.strokeStyle = shade(color,-.07); x.strokeRect(X0,Y0,X1-X0,Y1-Y0);
        x.lineWidth = 2.5; x.strokeStyle = shade(color,.07); x.strokeRect(X0-4,Y0-4,X1-X0+8,Y1-Y0+8);
        x.lineWidth = 2; x.strokeStyle = shade(color,-.17); x.strokeRect(X0+5,Y0+5,X1-X0-10,Y1-Y0-10); };
      panel(.3,.75,2.7,2.65); panel(.3,3.35,2.7,7.55);
    }), tile: [3, 8.5] };
    case 'trellis': return { map: canvasTex(k, 384, 384, (x, w, h) => {
      x.fillStyle = color; x.fillRect(0,0,w,h); const m = lum(color) < .45 ? shade(color, .2) : shade(color, -.17);
      x.strokeStyle = m; x.lineWidth = 7; x.lineJoin = 'round'; const s = 192;
      for (let i = -1; i < 3; i++) for (let j = -1; j < 3; j++) { const cx = i*s + s/2, cy = j*s + s/2, a = s/2, p = .32;
        x.beginPath(); x.moveTo(cx, cy-a);
        x.quadraticCurveTo(cx + a*p, cy - a*p, cx + a, cy); x.quadraticCurveTo(cx + a*p, cy + a*p, cx, cy + a);
        x.quadraticCurveTo(cx - a*p, cy + a*p, cx - a, cy); x.quadraticCurveTo(cx - a*p, cy - a*p, cx, cy - a); x.stroke();
        x.fillStyle = m; x.beginPath(); x.arc(cx, cy, 6, 0, 7); x.fill(); }
    }), tile: [1.5, 1.5] };
    case 'stripe': return { map: canvasTex(k, 256, 256, (x, w, h) => {
      x.fillStyle = color; x.fillRect(0,0,w,h); x.fillStyle = lum(color) < .45 ? shade(color,.06) : shade(color,-.06); x.fillRect(0,0,w/2,h);
      x.fillStyle = lum(color) < .45 ? shade(color,.15) : shade(color,-.16); x.fillRect(w/2-1,0,3,h); x.fillRect(0,0,2,h);
    }), tile: [1.2, 1.2] };
    default: return { map: null, tile: [1,1] };
  }
}

function floorTex(pattern, tone){
  const key = 'f:' + pattern + tone;
  if (texCache.has(key)) return texCache.get(key);
  const S = 2048, ppf = S/8;
  const drawPlank = (x, px, py, pw, ph, seed, horiz) => {
    const r = rng(seed * 7919 + 13); x.fillStyle = shade(tone, (r()-.5)*.09); x.fillRect(px, py, pw, ph);
    for (let g = 0; g < 7; g++) { x.beginPath(); const off = r(); const amp = .6 + r()*1.8, fr = .01 + r()*.02, ph0 = r()*6;
      if (horiz) { const yy = py + off*ph; x.moveTo(px, yy); for (let t = 0; t <= pw; t += 12) x.lineTo(px + t, yy + Math.sin(t*fr + ph0)*amp); }
      else { const xx = px + off*pw; x.moveTo(xx, py); for (let t = 0; t <= ph; t += 12) x.lineTo(xx + Math.sin(t*fr + ph0)*amp, py + t); }
      x.strokeStyle = rgba(shade(tone, r() < .5 ? -.12 : .08), .25); x.lineWidth = .8 + r()*1.4; x.stroke(); }
    x.strokeStyle = 'rgba(15,10,6,.45)'; x.lineWidth = 2; x.strokeRect(px, py, pw, ph);
  };
  const t = canvasTex(key, S, S, (x) => {
    if (pattern === 'herringbone') {
      const w = ppf/3, L = 6*w;
      for (let s = -4; s <= 4; s++) for (let k = -6; k <= 32; k++) {
        const sx = s*L, sy = -s*L; const cls = mod(k + 6*s, 24)*2 + mod(s, 2);
        const hx = k*w + sx, hy = k*w + sy; if (hx < S + 10 && hx + L > -10 && hy < S + 10 && hy + w > -10) drawPlank(x, hx, hy, L, w, cls + 1, true);
        const vx = k*w + sx, vy = k*w + w + sy; if (vx < S + 10 && vx + w > -10 && vy < S + 10 && vy + L > -10) drawPlank(x, vx, vy, w, L, cls + 101, false);
      }
    } else {
      const rowH = ppf*8/12; const sets = [[3,5],[2.5,2.5,3],[4,4],[2,3,3],[3.5,4.5],[5,3]];
      for (let row = 0; row < 12; row++) { const r = rng(row + 41); let xx = r()*S; const set = sets[Math.floor(r()*sets.length)];
        set.forEach((len, i) => { const pw = len*ppf; drawPlank(x, xx, row*rowH, pw, rowH, row*10 + i + 3, true); drawPlank(x, xx - S, row*rowH, pw, rowH, row*10 + i + 3, true); xx += pw; }); }
    }
  });
  t.center.set(.5, .5); t.rotation = pattern === 'herringbone' ? Math.PI/4 : Math.PI/2; t.repeat.set(6, 6);
  return t;
}

function marbleTex(id){

  };
  const saveBtn = h('button', { class: 'btn', on: save }, isNew ? 'Add to room' : 'Save');
  const del = h('button', { class: 'btn sec', style: 'color:#8b3b2e' }, 'Delete item');
  del.onclick = () => { closeDlg(); confirmDlg('Delete “' + (ci.name || 'item') + '” for everyone?', async () => { await mutate({ op: 'delItem', id: ci.id }, st => st.items = st.items.filter(x => x.id !== ci.id)); S.items = S.items.filter(i => i.t !== 'c:' + ci.id); if (S.above === 'c:' + ci.id) { S.above = 'none'; buildFireplace(); } rebuildItems(); renderPanel(); }); };
  dlgbox.append(h('h3', {}, isNew ? 'Add an item' : 'Edit item'), h('p', {}, 'It shows in the room as a simple shape at this size and color. The photo and spec sheet stay attached for reference.'),
    h('div', { class: 'form' },
      h('label', {}, 'Describe it'), h('div', { class: 'inl', style: 'align-items:flex-start' }, desc, aiBtn), aiStat,
      h('label', {}, 'Photo'), h('div', { class: 'prev', style: 'margin-top:0' }, prevImg, h('div', { style: 'flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start' }, photoBtn, photoStat)), photoIn,
      h('label', {}, 'Name'), name, h('label', {}, 'What is it'), kind,
      h('label', {}, 'What it’s for / notes'), notes,
      dimLbl, h('div', { class: 'three' }, W_, D_, H_),
      h('label', {}, 'Color in the 3D view'), h('div', { class: 'inl' }, useCol, col, h('span', { style: 'font-size:12.5px;color:var(--muted)' }, 'Use this color. Untick to follow the scheme fabrics; a photo sets it automatically.')),
      h('label', {}, 'Spec sheet'), h('div', { class: 'inl' }, specBtn, specStat), specIn,
      h('label', {}, 'Price'), price, h('label', {}, 'Product link'), url,
      h('label', {}, 'Added by'), whoRow()),
    h('div', { class: 'bts', style: 'margin-top:14px' }, h('button', { class: 'btn sec', on: closeDlg }, 'Cancel'), saveBtn),
    isNew ? '' : h('div', { style: 'margin-top:8px' }, del));
  col.addEventListener('input', () => useCol.checked = true);
  dlg.classList.add('show');
}
function infoDlg(ci){
  dlgbox.innerHTML = ''; const kn = (KINDS.find(k => k[0] === ci.kind) || [, 'Item'])[1];
  const linkBtn = (href, txt) => h('a', { href, target: '_blank', rel: 'noopener', class: 'btn sec', style: 'display:block;text-align:center;text-decoration:none;box-sizing:border-box;margin-bottom:8px' }, txt);
  dlgbox.append(h('div', { class: 'info' }, pic(ci) ? h('img', { src: pic(ci), alt: '' }) : '', h('h3', { style: 'margin-top:10px' }, ci.name),
    h('div', { class: 'meta' }, [kn, fmtDims(ci), ci.price, ci.by ? 'added by ' + ci.by : ''].filter(Boolean).join(' · ')),
    ci.notes ? h('div', { class: 'notes' }, ci.notes) : '',
    ci.spec ? linkBtn(fileUrl(ci.spec.path), 'Open spec sheet ↗') : '',
    ci.url ? linkBtn(ci.url, 'Open product page ↗') : '',
    h('div', { class: 'bts' }, h('button', { class: 'btn sec', on: closeDlg }, 'Close'), h('button', { class: 'btn', on: () => itemDlg(ci) }, 'Edit'))));
  dlg.classList.add('show');
}
function confirmDlg(msg, fn){ dlgbox.innerHTML = ''; dlgbox.append(h('h3', {}, msg), h('div', { class: 'bts' }, h('button', { class: 'btn sec', on: closeDlg }, 'Cancel'), h('button', { class: 'btn', on: () => { closeDlg(); fn(); } }, 'Yes')));
  dlg.classList.add('show'); }
let toastT; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- resize + loop ---------- */
function resize(){ const w = wrap.clientWidth, hh = wrap.clientHeight; renderer.setSize(w, hh, false); camera.aspect = w/hh; camera.fov = camera.aspect < 1 ? 74 : 58;
  const sr = sheet.getBoundingClientRect(), hb = document.querySelector('header').getBoundingClientRect().bottom;
  let dx = 0, dy = 0; if (innerWidth >= 900) dx = Math.max(0, w/2 - sr.left/2) * .6; else dy = Math.max(0, hh/2 - (hb + Math.min(sr.top, hh))/2);
  camera.setViewOffset(w, hh, dx, dy, w, hh); camera.updateProjectionMatrix(); positionSelbar(); }
sheet.addEventListener('transitionend', resize);
new ResizeObserver(resize).observe(wrap);
const clock = new THREE.Clock(); const _v = new THREE.Vector3();
function loop(){
  const t = clock.getElapsedTime();
  if (camAnim) { const k = Math.min(1, (performance.now() - camAnim.t0)/700), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    camera.position.lerpVectors(camAnim.from.p, camAnim.to.p, e); controls.target.lerpVectors(camAnim.from.t, camAnim.to.t, e); if (k >= 1) camAnim = null; }
  flames.forEach(f => { const p = f.userData.ph; f.scale.y = 1 + .18*Math.sin(t*6.3 + p) + .08*Math.sin(t*13.7 + p*2); f.scale.x = 1 + .08*Math.sin(t*4.1 + p); });
  if (fireLight && S && S.fire) fireLight.intensity = (S.time === 'evening' ? 9 : 3)*(1 + .12*Math.sin(t*9) + .06*Math.sin(t*23));
  controls.update();
  for (const c of cutaways) { const v = _v.copy(camera.position).sub(c.a).dot(c.n) > 0; if (c.acc.visible !== v) c.acc.visible = v; }
  const fv = camera.position.x > 0.05; fireGroup.traverse(o => { if (o.isMesh && o.userData.cut !== fv) { o.userData.cut = fv; o.visible = flames.includes(o) ? (fv && !!S.fire) : fv; } });
  renderer.render(scene, camera); requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
loadState(PRESETS[0].s, PRESETS[0].name);
resize(); goView(0, true); document.getElementById('loading').remove(); loop();
syncStore().then(() => { const hs = (location.hash || '').replace('#', ''); const hv = hs.startsWith('v-') && allVersions().find(v => 'v-' + v.id === hs); if (hv) loadState(hv.state, hv.name); });
window.__lr = { scene, camera, goView, loadState, PRESETS, get S(){ return S; }, get store(){ return store; }, renderer, setTab: k => { tab = k; renderPanel(); }, addItem, setSelected, itemDlg, syncStore };
</script>
